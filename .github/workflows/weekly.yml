name: IG Audit (Weekly + Monthly Rolling)

on:
  schedule:
    # '0 18 * * 0' = Minggu 18:00 UTC = Senin 01:00 WIB.
    - cron: '0 18 * * 0'
  workflow_dispatch:   # manual trigger via GitHub UI

permissions:
  contents: write      # dibutuhkan step keepalive untuk push commit

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run audit (generates both weekly + monthly)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Layer analisa Top 3 (cara / kenapa / tiru). Kalau secret ini
          # kosong, script tetap jalan, hanya tanpa penjelasan naratif.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python audit.py

      - name: Archive snapshots + PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ github.run_id }}
          path: |
            ig-weekly-audit-*.pdf
            ig-monthly-audit-*.pdf
            snapshot-weekly-*.json
            snapshot-monthly-*.json
          retention-days: 365

      # ------------------------------------------------------------------
      # KEEPALIVE — mencegah GitHub auto-disable cron setelah 60 hari
      # tanpa aktivitas commit di repo. Jalan walau audit gagal.
      # Commit pakai GITHUB_TOKEN tidak men-trigger workflow lagi (no loop).
      # ------------------------------------------------------------------
      - name: Keepalive (cegah auto-disable 60 hari)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d) [skip ci]" || exit 0
          git pull --rebase
          git push
